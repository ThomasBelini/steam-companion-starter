[package]
name = "steam-companion"
version = "0.1.0"
description = "Steam Companion — protótipo demonstrativo Windows"
edition = "2021"
license = "MIT"
publish = false
default-run = "steam-companion"

[[example]]
name = "pairing-lab"
path = "prototype/main.rs"
required-features = ["pairing-prototype"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
base64 = { version = "=0.23.1", optional = true }
getrandom = { version = "=0.3.4", optional = true }
sha2 = { version = "=0.10.9", optional = true }
zeroize = { version = "=1.8.2", optional = true }

[features]
custom-protocol = ["tauri/custom-protocol"]
pairing-prototype = ["dep:base64", "dep:getrandom", "dep:sha2", "dep:zeroize"]
desktop-pairing-demo = ["pairing-prototype"]
